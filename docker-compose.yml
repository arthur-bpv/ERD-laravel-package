
services:
    app:
        build: ./docker
        user: "1000:1000"
        environment:
            HOME: /tmp # Composer cache directory
        volumes:
            - .:/app
        ports:
            - "8000:8000"

    vite:
        image: node:22-alpine
        working_dir: /app
        user: "1000:1000"
        environment:
            HOME: /tmp # npm cache directory
            VITE_DEV_ORIGIN: http://${DEV_HOST:-localhost}:5173
        volumes:
            - .:/app
        ports:
            - "5173:5173"
        command: sh /app/docker/start-vite.sh
